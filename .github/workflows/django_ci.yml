name: Django DRF Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django System Check
      env:
        SECRET_KEY: django-insecure-ci-test-key-udbhav-2026
        DEBUG: "True"
      run: |
        cd Backend
        python manage.py check

    - name: Collect Static Files
      env:
        SECRET_KEY: django-insecure-ci-test-key-udbhav-2026
        DEBUG: "True"
      run: |
        cd Backend
        python manage.py collectstatic --noinput

    - name: Run Automated Unit Tests (All 4 Modules: core, authentication, administration, content)
      env:
        SECRET_KEY: django-insecure-ci-test-key-udbhav-2026
        DEBUG: "True"
      run: |
        cd Backend
        python manage.py test apps.core apps.authentication apps.administration apps.content
