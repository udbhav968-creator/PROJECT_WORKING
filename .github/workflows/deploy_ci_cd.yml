name: Enterprise Full-Stack MLOps & DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  enterprise-ci-cd-suite:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: 'django-insecure-ci-cd-test-key-2026'
      DEBUG: 'True'

    steps:
      - name: 📦 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'Backend/requirements.txt'

      - name: ⚡ Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: 🛡️ Verify Django System Integrity Check
        run: |
          cd Backend
          python manage.py check

      - name: 🗄️ Verify Database Migrations
        run: |
          cd Backend
          python manage.py migrate

      - name: 🧪 Run Full 105-Test Multi-App Enterprise MLOps & Integration Suite
        run: |
          cd Backend
          python manage.py test apps.core.tests apps.authentication.tests apps.administration.tests apps.content.tests

