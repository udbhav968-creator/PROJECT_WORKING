name: Enterprise Full-Stack MLOps & DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: clinic_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd Backend
          pip install -r requirements.txt || pip install django djangorestframework django-cors-headers drf-yasg pillow

      - name: Run Automated Unit & API Test Suite (53 Tests)
        run: |
          cd Backend
          python manage.py test apps.core apps.authentication apps.administration apps.content

      - name: Verify Docker Container Build
        run: |
          docker build -t purehealth-backend:latest .
