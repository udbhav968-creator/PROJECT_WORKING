name: Enterprise Full-Stack MLOps & DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: 'django-insecure-ci-cd-test-key-2026'
      DEBUG: 'True'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Verify Django System Integrity Check
        run: |
          cd Backend
          python manage.py check

      - name: Verify Database Migrations
        run: |
          cd Backend
          python manage.py migrate

      - name: Test Real-World Datasets & Dynamic Non-Default Values
        run: |
          cd Backend
          python manage.py test apps.administration.tests

      - name: Run Full 100-Test Century Milestone Microservice & Integration Suite
        run: |
          cd Backend
          python manage.py test apps.core.tests apps.authentication.tests apps.administration.tests apps.content.tests
